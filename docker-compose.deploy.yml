# Visora — public frontend/api; worker private (no expose, no host ports).
# Only Deploy-injected values: IMAGE_TAG (image lines) + *_HOST_PORT (ports lines).
# Everything under environment: is empty → paste via Deploy UI Raw (.env.deploy).
name: visora

services:
  api-server:
    image: fybud/visora-api:${IMAGE_TAG:?IMAGE_TAG required}
    command: ["server"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      JWT_SECRET:
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      OPENAI_API_KEY:
      OPENAI_BASE_URL:
      VISORA_LLM_MODEL:
      SERP_API_KEY:
      TURNSTILE_SECRET_KEY:
      GEO_OPENAI_API_KEY:
      GEO_OPENAI_BASE_URL:
      GEO_MODEL_GPT:
      GEO_MODEL_CLAUDE:
      GEO_MODEL_GEMINI:
      GEO_MODEL_GROK:
      CRAWL_CONCURRENCY:
      CRAWL_DELAY_MS:
      SERP_CONCURRENCY:
      GEO_CONCURRENCY:
      WORKER_STUCK_MINUTES:
      WORKER_MAX_ATTEMPTS:
      DATABASE_URL:
      FRONTEND_URL:
      API_BASE_EXTERNAL:
      COOKIE_DOMAIN:
      GIN_MODE:
      PORT:
    ports:
      # Host port = Deploy. Container port 8080 must match pasted PORT=.
      - "127.0.0.1:${API_HOST_PORT}:8080"
    labels:
      fybud.expose: "true"
      fybud.domain: api.visora.fybud.com
      fybud.role: api
      fybud.health: "/api/health"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [fybud-net, internal]

  worker:
    image: fybud/visora-api:${IMAGE_TAG:?IMAGE_TAG required}
    command: ["worker"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      OPENAI_API_KEY:
      OPENAI_BASE_URL:
      VISORA_LLM_MODEL:
      SERP_API_KEY:
      GEO_OPENAI_API_KEY:
      GEO_OPENAI_BASE_URL:
      GEO_MODEL_GPT:
      GEO_MODEL_CLAUDE:
      GEO_MODEL_GEMINI:
      GEO_MODEL_GROK:
      CRAWL_CONCURRENCY:
      CRAWL_DELAY_MS:
      SERP_CONCURRENCY:
      GEO_CONCURRENCY:
      WORKER_STUCK_MINUTES:
      WORKER_MAX_ATTEMPTS:
      DATABASE_URL:
    depends_on: [api-server]
    networks: [fybud-net]

  frontend:
    image: fybud/visora-web:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    env_file: [.env]
    environment:
      API_BASE_URL:
      WEB_PORT:
    command: ["sh", "-c", "export PORT=\"$$WEB_PORT\"; exec node server.js"]
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:3000"
    labels:
      fybud.expose: "true"
      fybud.domain: visora.fybud.com
      fybud.role: web
      fybud.health: "any"
    depends_on: [api-server]
    networks: [internal]

networks:
  fybud-net:
    name: fybud-net
    external: true
  internal:
    driver: bridge
