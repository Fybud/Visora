name: build-push

# Build Visora images on GitHub-hosted runners, push to Docker Hub,
# then notify fybud Deploy to redeploy approved tenants.
# The VPS never builds images. api-server and worker share one image.
# The web image is tenant-agnostic: browser code derives the API origin
# from the tenant hostname at runtime.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded builds so two pushes never race the VPS.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_ORG: fybud
  TOOL: visora

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: visora-api
            context: backend
            dockerfile: backend/Dockerfile
          - name: web
            image: visora-web
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_ORG }}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
            ${{ env.DOCKERHUB_ORG }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  notify:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Notify fybud Deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event_name }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          COMMITTED_AT: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          REPO: ${{ github.repository }}
        run: |
          : "${DEPLOY_WEBHOOK_URL:?DEPLOY_WEBHOOK_URL secret is required}"
          : "${DEPLOY_WEBHOOK_SECRET:?DEPLOY_WEBHOOK_SECRET secret is required}"
          TAG="sha-${COMMIT_SHA}"
          PUSHED_AT="${COMMITTED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          payload=$(jq -n \
            --arg tool "$TOOL" \
            --arg tag "$TAG" \
            --arg repo "$REPO" \
            --arg commit "$COMMIT_SHA" \
            --arg commitMessage "$COMMIT_MSG" \
            --arg commitAuthor "$COMMIT_AUTHOR" \
            --arg pushedAt "$PUSHED_AT" \
            --arg api "${DOCKERHUB_ORG}/visora-api:${TAG}" \
            --arg web "${DOCKERHUB_ORG}/visora-web:${TAG}" \
            '{tool:$tool,tag:$tag,repo:$repo,commit:$commit,commitMessage:$commitMessage,commitAuthor:$commitAuthor,pushedAt:$pushedAt,images:{api:$api,web:$web}}')
          echo "$payload"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 60 -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: $DEPLOY_WEBHOOK_SECRET" \
            -d "$payload"
