# Visora — public frontend/api; worker private (no expose, no host ports).
name: visora

services:
  api-server:
    image: fybud/visora-api:${IMAGE_TAG:-latest}
    command: ["server"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Paste in the Deploy UI (Settings → Tool specs → requiredEnv): empty value = "needs pasting".
      JWT_SECRET:
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      OPENAI_API_KEY:
      SERP_API_KEY:
      # Optional — paste only if used (optionalEnv): TURNSTILE_SECRET_KEY, OPENAI_BASE_URL,
      # VISORA_LLM_MODEL, GEO_OPENAI_API_KEY, WORKER_STUCK_MINUTES, WORKER_MAX_ATTEMPTS.
      # Deploy-injected — never pasted.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL required}
      API_BASE_EXTERNAL: ${API_BASE_EXTERNAL:?API_BASE_EXTERNAL required}
    ports:
      - "127.0.0.1:${API_HOST_PORT}:8080"
    labels:
      fybud.expose: "true"
      fybud.domain: api.visora.fybud.com
      fybud.health: "/api/health"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [fybud-net, internal]

  worker:
    image: fybud/visora-api:${IMAGE_TAG:-latest}
    command: ["worker"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      # The worker runs the same geo/LLM jobs, so paste the same keys it reads.
      OPENAI_API_KEY:
      SERP_API_KEY:
      # Deploy-injected — never pasted.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
    depends_on: [api-server]
    networks: [fybud-net]

  frontend:
    image: fybud/visora-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api-server:8080/api
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:3000"
    labels:
      fybud.expose: "true"
      fybud.domain: visora.fybud.com
      fybud.health: "/"
    depends_on: [api-server]
    networks: [internal]

networks:
  fybud-net:
    name: fybud-net
    external: true
  internal:
    driver: bridge
