# Visora — public frontend/api; worker private (no expose, no host ports).
name: visora

services:
  api-server:
    image: fybud/visora-api:${IMAGE_TAG:-latest}
    command: ["server"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Empty = paste in Deploy UI. Literal = fixed here. ${VAR:?…} = Deploy-injected.
      JWT_SECRET:
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      OPENAI_API_KEY:
      SERP_API_KEY:
      TURNSTILE_SECRET_KEY:
      OPENAI_BASE_URL:
      VISORA_LLM_MODEL:
      GEO_OPENAI_API_KEY:
      WORKER_STUCK_MINUTES:
      WORKER_MAX_ATTEMPTS:
      # Deploy-injected — never pasted.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL required}
      API_BASE_EXTERNAL: ${API_BASE_EXTERNAL:?API_BASE_EXTERNAL required}
      GIN_MODE: release
      PORT: "8080"
    ports:
      - "127.0.0.1:${API_HOST_PORT}:8080"
    labels:
      fybud.expose: "true"
      fybud.domain: api.visora.fybud.com
      fybud.role: api
      fybud.health: "/api/health"
    healthcheck:
      # alpine image installs wget explicitly in the Dockerfile.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [fybud-net, internal]

  worker:
    image: fybud/visora-api:${IMAGE_TAG:-latest}
    command: ["worker"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      OPENAI_API_KEY:
      SERP_API_KEY:
      OPENAI_BASE_URL:
      VISORA_LLM_MODEL:
      GEO_OPENAI_API_KEY:
      WORKER_STUCK_MINUTES:
      WORKER_MAX_ATTEMPTS:
      # Deploy-injected — never pasted.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
    depends_on: [api-server]
    networks: [fybud-net]

  frontend:
    image: fybud/visora-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # In-cluster proxy to the API (not public). Host nginx fronts this container on :3000.
      API_BASE_URL: http://api-server:8080/api
      PORT: "3000"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:3000"
    labels:
      fybud.expose: "true"
      fybud.domain: visora.fybud.com
      fybud.role: web
      fybud.health: "/"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on: [api-server]
    networks: [internal]

networks:
  fybud-net:
    name: fybud-net
    external: true
  internal:
    driver: bridge
